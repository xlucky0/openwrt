name: Build WP8722-BT

on:
  workflow_dispatch:
  push:
    branches: [openwrt-wp8722-bt]
    paths: [".github/workflows/build-wp8722-bt.yml"]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: openwrt-wp8722-bt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget python3 python3-pyelftools libelf-dev

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_liteon_wp8722-bt=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          grep -E 'wp8722|INITRAMFS=|PACKAGE_luci=' .config

      - name: Download sources
        run: make download -j8

      - name: Build
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect images
        run: |
          mkdir out
          cp bin/targets/ath79/generic/*wp8722-bt* out/ || true
          cp bin/targets/ath79/generic/sha256sums out/ || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: wp8722-bt-images
          path: out/
